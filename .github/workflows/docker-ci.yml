name: Docker CI

on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - "*"
  workflow_dispatch:

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DB_NAME: hmiyc_test
  DB_USER: postgres
  DB_PASSWORD: postgres123

jobs:
  docker-build-and-health-check:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          echo "DB_NAME=${{ env.DB_NAME }}" >> .env
          echo "DB_USER=${{ env.DB_USER }}" >> .env
          echo "DB_PASSWORD=${{ env.DB_PASSWORD }}" >> .env

      - name: Build Docker images
        env:
          DB_NAME: ${{ env.DB_NAME }}
          DB_USER: ${{ env.DB_USER }}
          DB_PASSWORD: ${{ env.DB_PASSWORD }}
        run: make docker-build

      - name: Start services
        env:
          DB_NAME: ${{ env.DB_NAME }}
          DB_USER: ${{ env.DB_USER }}
          DB_PASSWORD: ${{ env.DB_PASSWORD }}
        run: |
          # Ensure no leftover containers/volumes from previous steps (clean state)
          docker compose down -v || true
          make docker-up-detached

      - name: Wait for PostgreSQL to be healthy
        run: |
          echo "Waiting for PostgreSQL..."
          timeout 60 bash -c 'until docker compose exec -T postgres pg_isready -U ${{ env.DB_USER }} -d ${{ env.DB_NAME }}; do sleep 2; done'
          echo "PostgreSQL is ready!"

      - name: Wait for Backend to be healthy
        run: |
          echo "Waiting for Backend..."
          timeout 120 bash -c 'until curl -sf http://localhost:8080/hello; do sleep 5; done'
          echo "Backend is ready!"

      - name: Check Backend API response
        run: |
          echo "Testing /hello endpoint..."
          curl -sf http://localhost:8080/hello
          echo ""
          echo "Testing /players endpoint..."
          curl -sf http://localhost:8080/players | head -c 500
          echo ""
          echo "✅ Backend API is responding"

      - name: Check Flyway migrations applied
        run: |
          echo "Checking Flyway migration status..."
          docker compose exec -T postgres psql -U ${{ env.DB_USER }} -d ${{ env.DB_NAME }} -c "SELECT version, description, success FROM flyway_schema_history ORDER BY installed_rank;"
          echo "✅ Flyway migrations applied successfully"

      - name: Verify database initialization (basic counts)
        run: |
          echo "🔍 Verifying Docker Compose database initialization..."
          
          # Check players table
          PLAYER_COUNT=$(docker compose exec -T postgres psql -U ${{ env.DB_USER }} -d ${{ env.DB_NAME }} -t -c "SELECT COUNT(*) FROM players;" | tr -d '[:space:]')
          echo "Players: $PLAYER_COUNT"
          [ "$PLAYER_COUNT" -ge 90 ] || { echo "❌ Expected 90 players initialized with seed data"; exit 1; }
          
          # Check phishing_categories table
          CATEGORY_COUNT=$(docker compose exec -T postgres psql -U ${{ env.DB_USER }} -d ${{ env.DB_NAME }} -t -c "SELECT COUNT(*) FROM phishing_categories;" | tr -d '[:space:]')
          echo "Phishing categories: $CATEGORY_COUNT"
          [ "$CATEGORY_COUNT" -eq 7 ] || { echo "❌ Expected 7 phishing categories, got $CATEGORY_COUNT"; exit 1; }
          
          # Check questions table
          QUESTION_COUNT=$(docker compose exec -T postgres psql -U ${{ env.DB_USER }} -d ${{ env.DB_NAME }} -t -c "SELECT COUNT(*) FROM questions;" | tr -d '[:space:]')
          echo "Questions: $QUESTION_COUNT"
          [ "$QUESTION_COUNT" -eq 70 ] || { echo "❌ Expected 70 questions, got $QUESTION_COUNT"; exit 1; }
          
          echo "✅ Docker Compose database properly initialized with expected data"

      - name: Wait for Frontend to be healthy
        run: |
          echo "Waiting for Frontend..."
          timeout 120 bash -c 'until curl -sf http://localhost:3000; do sleep 5; done'
          echo "Frontend is ready!"

      - name: Show running containers
        if: always()
        run: docker compose ps

      - name: Show backend logs on failure
        if: failure()
        run: docker compose logs backend

      - name: Show postgres logs on failure
        if: failure()
        run: docker compose logs postgres

      - name: Cleanup
        if: always()
        run: docker compose down -v
