server:
  port: ${PORT:8080}
spring:
  datasource:
    url: jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:${DB_NAME:hmiyc}}
    driver-class-name: org.postgresql.Driver
    username: ${PGUSER:${DB_USER:postgres}}
    password: ${PGPASSWORD:${DB_PASSWORD:postgres@123}}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: ${SHOW_SQL:false}
    generate-ddl: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true
    locations: classpath:db/migration
  sql:
    init:
      mode: always
      data-locations: classpath:db/init.sql
